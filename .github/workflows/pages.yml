# Testa o porte do motor e publica a avaliação no GitHub Pages.
# Ative uma vez em Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Teste de aceitação do motor (JS = Python)
        run: node diagnostica-adaptativa/scripts/teste_motor_node.js

  publicar:
    needs: testar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site (só o que a página usa)
        run: |
          mkdir -p _site/banco
          cd diagnostica-adaptativa
          cp -r index.html professor.html teste_motor.html css js teste ../_site/
          cp -r banco/itens.json banco/matriz.json banco/figuras ../_site/banco/
          touch ../_site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
